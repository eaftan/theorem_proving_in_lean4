name: Publish PDF

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pages.yml
      - print/**
      - book/**
      - examples/**
      - scripts/print-book.py
      - scripts/print-book.py.lock
      - scripts/print-book.css
      - scripts/print_manifest.py
      - LICENSE
      - NOTICE*
      - COPYING*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    name: Package checked-in PDF
    if: github.repository == 'eaftan/theorem_proving_in_lean4' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify PDF inputs and file integrity
        run: python3 scripts/print_manifest.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Stage PDF and notices
        run: |
          mkdir -p book/_out/pages
          cp print/Theorem-Proving-in-Lean-4.pdf print/Theorem-Proving-in-Lean-4.json print/index.html LICENSE print/DejaVu-LICENSE.txt book/_out/pages/
          touch book/_out/pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: book/_out/pages

  deploy:
    name: Publish PDF to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

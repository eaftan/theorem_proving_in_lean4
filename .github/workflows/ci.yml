name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the main branch or for release branches
  push:
    branches:
      - 'master'
      - 'release/*'
    tags:
      - '*'
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This workflow builds pull request code, including code from forks, so it holds
# no secrets and only reads during the build. HTML and PDF leave as artifacts;
# a separate job publishes PDFs only from this fork's master branch.
permissions:
  contents: read

jobs:
  print-tests:
    name: Test PDF provenance checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test PDF provenance and file integrity
        run: python3 -m unittest discover -s scripts -p test_print_manifest.py -v

  build:
    name: Build book
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check SubVerso revisions agree
        run: ./scripts/subverso-rev.sh --check

      - name: Setup elan toolchain on this build
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none

      - name: Set elan paths
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install lean toolchain for examples
        run: |
          cd examples
          lean --version

      - name: Install lean toolchain for text
        run: |
          cd book
          lean --version

      - name: Cache examples/.lake
        uses: actions/cache@v6.1.0
        with:
          path: examples/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}
          # Try to restore cache for same OS/Lean/deps, but don't get less specific, because Lake isn't always happy to get build product version mismatches
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-

      - name: Cache book/.lake
        uses: actions/cache@v6.1.0
        with:
          path: book/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          # The examples files are in the key because book elaboration reads them (the advertised Lean version and the extraction hash), invisibly to Lake's traces.
          key: ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}
          # Try to restore cache for same OS/Lean/deps, but don't get less specific, because Lake isn't always happy to get build product version mismatches
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-

      - name: Build example code
        run: |
          pushd examples
          lake build
          lake build subverso-extract-mod
          popd

      - name: Save examples/.lake
        uses: actions/cache/save@v6.1.0
        with:
          path: examples/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}

      - name: Build book
        run: |
          pushd book
          lake exe tpil --verbose
          popd

      - name: Save book/.lake
        uses: actions/cache/save@v6.1.0
        with:
          path: book/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          # Match the restore key, including the example inputs read during elaboration.
          key: ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}

      # Save the example oleans and highlight JSON files produced during the book build.
      # The key needs a suffix because a save with an already-reserved key is silently rejected.
      - name: Save examples/.lake again
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            examples/.lake
            examples/Examples
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}-post-book

      - name: Upload book HTML
        uses: actions/upload-artifact@v7.0.1
        with:
          name: book-html
          path: book/_out/html-multi
          retention-days: 7
          if-no-files-found: error

      - name: Set up PDF build tools
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scripts/print-book.py.lock

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Test PDF converter
        run: >-
          uv run --python 3.12 --with beautifulsoup4==4.15.0 --with weasyprint==70.0
          python -m unittest discover -s scripts -p test_print_book.py -v

      - name: Generate PDF from this checkout's HTML
        run: >-
          uv run --locked scripts/print-book.py
          --output book/_out/print-ci/Theorem-Proving-in-Lean-4.pdf

      - name: Verify generated PDF inputs and file integrity
        run: >-
          python3 scripts/print_manifest.py
          --pdf book/_out/print-ci/Theorem-Proving-in-Lean-4.pdf

      - name: Upload printable PDF and manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: printable-pdf
          path: |
            book/_out/print-ci/Theorem-Proving-in-Lean-4.pdf
            book/_out/print-ci/Theorem-Proving-in-Lean-4.json
          retention-days: 30
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.repository == 'eaftan/theorem_proving_in_lean4' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5.0.0

      - name: Stage generated PDF and notices
        if: github.repository == 'eaftan/theorem_proving_in_lean4' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p book/_out/pages
          cp book/_out/print-ci/Theorem-Proving-in-Lean-4.pdf book/_out/print-ci/Theorem-Proving-in-Lean-4.json print/index.html LICENSE print/DejaVu-LICENSE.txt book/_out/pages/
          touch book/_out/pages/.nojekyll

      - name: Upload Pages artifact
        if: github.repository == 'eaftan/theorem_proving_in_lean4' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: book/_out/pages

  publish-pdf:
    name: Publish generated PDF to GitHub Pages
    needs: [build, print-tests]
    if: github.repository == 'eaftan/theorem_proving_in_lean4' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this build is still the latest master
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer master commit exists; skipping this older build."
          fi

      - name: Deploy generated PDF to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4.0.5
